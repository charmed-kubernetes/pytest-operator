name: Test Suite

on:
  - pull_request

jobs:
  call-inclusive-naming-check:
    name: Inclusive naming
    uses: canonical/inclusive-naming/.github/workflows/woke.yaml@7aa0f7a606f182bd03a7adb28e0d710216101ca5 # main
    with:
      fail-on-error: "true"

  lint-unit:
    name: Lint Unit
    uses: charmed-kubernetes/workflows/.github/workflows/lint-unit.yaml@6ee58c37d404effad4598ce7b523dbaf0cb99285 # main
    with:
      with-uv: true
      python: "['3.8', '3.9', '3.10', '3.11', '3.12']"
    needs:
      - call-inclusive-naming-check

  integration-test-2-9:
    name: Integration test with juju
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      matrix:
        juju: ['2.9']
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'

    - name: Setup operator test environment
      uses: charmed-kubernetes/actions-operator@ea90ed489690bf3b1c1fcca6ac5f9edab70aecb0 # main
      with:
        charm-channel: 3.x/stable
        juju-channel: ${{ matrix.juju }}/stable

    - name: Run integration tests
      run: tox -e integration-2.9

    - name: Collect Charmcraft Logs
      if: ${{ failure() }}
      run: |
        mkdir -p tmp/
        mv $HOME/.local/state/charmcraft/log/* tmp/ | true
        shopt -s globstar
        cp ${GITHUB_WORKSPACE}/.tox/integration*/tmp/*.charm tmp/ | true

    - name: Upload debug artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-run-artifacts-${{ matrix.juju }}
        path: tmp

  integration-test:
    name: Integration test with juju
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 40
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
        juju: ['3.1', '3']
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'

    - name: Setup operator test environment
      uses: charmed-kubernetes/actions-operator@ea90ed489690bf3b1c1fcca6ac5f9edab70aecb0 # main
      with:
        charm-channel: 3.x/stable
        juju-channel: ${{ matrix.juju }}/stable

    - name: Run integration tests
      run: tox -e integration

    - name: Collect Charmcraft Logs
      if: ${{ failure() }}
      run: |
        mkdir -p tmp/
        mv $HOME/.local/state/charmcraft/log/* tmp/ | true
        shopt -s globstar
        cp ${GITHUB_WORKSPACE}/.tox/integration*/tmp/**/*.charm tmp/ | true

    - name: Upload debug artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-run-artifacts-${{ matrix.juju }}
        path: tmp
